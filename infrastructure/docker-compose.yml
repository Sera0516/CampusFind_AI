services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusfind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusfind_db
      POSTGRES_USER: campusfind_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfind_user -d campusfind_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
